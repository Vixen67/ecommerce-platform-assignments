name: Node.js Integration Tests CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: assignment2_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 18  # Fixed typo: changed from node-node-version to node-version

      - name: Install dependencies
        run: |
          cd backend
          npm install

      - name: Run Integration Tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: 1234
          DB_NAME: assignment2_test_db
          JWT_SECRET: test_secret_key
          NODE_ENV: test    # Added to match your app.js conditional check
        run: |
          cd backend
          npm test
